<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MD Reader · Clean Markdown Viewer</title>
    <!-- Tailwind + Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Arial, sans-serif' font-weight='bold' fill='%23000000' text-anchor='middle'%3EMD%3C/text%3E%3C/svg%3E">
    <style>
        /* custom overrides for better reading */
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Space+Grotesk:wght@500;600&display=swap');
        
        .markdown-body {
            max-width: 78ch;
            margin: 0 auto;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.75;
            font-size: 1rem;
            color: #1f2937;
        }
        .dark .markdown-body {
            color: #e5e7eb;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-family: 'Space Grotesk', monospace;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .markdown-body h1 { font-size: 2.2rem; margin-top: 2rem; margin-bottom: 1rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; }
        .dark .markdown-body h1 { border-bottom-color: #2d2d2d; }
        .markdown-body h2 { font-size: 1.7rem; margin-top: 1.8rem; margin-bottom: 0.75rem; }
        .markdown-body h3 { font-size: 1.3rem; margin-top: 1.4rem; }
        .markdown-body p { margin-bottom: 1.2rem; }
        .markdown-body pre { background: #f6f8fa; border-radius: 16px; padding: 1rem; overflow-x: auto; font-size: 0.85rem; }
        .dark .markdown-body pre { background: #111827; }
        .markdown-body code { background: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 8px; font-size: 0.9rem; }
        .dark .markdown-body code { background: #1e293b; }
        .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 1.2rem; color: #4b5563; font-style: italic; margin: 1rem 0; }
        .dark .markdown-body blockquote { color: #9ca3af; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1.2rem; }
        .markdown-body li { margin: 0.4rem 0; }
        .markdown-body a { color: #2563eb; text-decoration: underline; text-underline-offset: 3px; }
        .dark .markdown-body a { color: #60a5fa; }
        
        .drop-zone {
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .drop-zone.dragover {
            background-color: #eff6ff;
            border-color: #3b82f6;
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .dark .drop-zone.dragover {
            background-color: #1e293b;
            border-color: #3b82f6;
        }
        #sidebar {
            transition: transform 0.25s ease;
            will-change: transform;
            z-index: 40;
        }
        @media (max-width: 1023px) {
            #sidebar {
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            }
            #sidebar.open {
                transform: translateX(0);
            }
        }
        /* smooth scroll offset for anchor links */
        html {
            scroll-behavior: smooth;
        }
        .toc-link {
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .toc-link:hover {
            background-color: #f3f4f6;
            border-left-color: #3b82f6;
        }
        .dark .toc-link:hover {
            background-color: #1f2937;
            border-left-color: #60a5fa;
        }
        /* responsive reader padding */
        @media (max-width: 640px) {
            .markdown-body {
                font-size: 0.95rem;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 12px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1e1e2f;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-neutral-950 text-gray-900 dark:text-gray-100 antialiased">
    <div class="flex h-screen overflow-hidden relative">

        <!-- SIDEBAR - table of contents + upload -->
        <div id="sidebar" class="fixed lg:relative top-0 left-0 w-80 lg:w-80 h-full bg-white dark:bg-neutral-900 border-r border-gray-200 dark:border-neutral-800 flex flex-col shadow-xl lg:shadow-none z-50">
            
            <div class="p-5 border-b border-gray-200 dark:border-neutral-800 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                        <i class="fa-regular fa-markdown text-sm"></i>
                    </div>
                    <h1 class="text-xl font-semibold tracking-tight">MD Reader</h1>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-500 hover:text-gray-800 dark:hover:text-white text-xl p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Upload zone -->
            <div class="p-5">
                <div id="drop-zone" class="drop-zone border-2 border-dashed border-gray-300 dark:border-neutral-700 rounded-2xl h-48 flex flex-col items-center justify-center cursor-pointer bg-gray-50 dark:bg-neutral-800/40 transition-all">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-500 mb-3"></i>
                    <p class="font-medium text-center text-gray-700 dark:text-gray-200">Upload Markdown</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500 mt-1 text-center">.md or .markdown</p>
                    <p class="text-xs text-gray-400 mt-2 flex items-center gap-1"><i class="fa-regular fa-hand-pointer"></i> click or drag & drop</p>
                </div>
                <input type="file" id="file-input" accept=".md,.markdown,.txt" class="hidden">
            </div>

            <!-- Active file info -->
            <div id="file-info" class="hidden px-5 pb-2">
                <div class="flex items-center justify-between bg-gray-100 dark:bg-neutral-800/80 rounded-xl px-4 py-2.5 backdrop-blur-sm">
                    <div class="flex items-center gap-2 min-w-0">
                        <i class="fa-solid fa-file-lines text-blue-500 text-sm"></i>
                        <span id="filename" class="font-medium text-sm truncate text-gray-800 dark:text-gray-200"></span>
                    </div>
                    <button onclick="clearFile()" class="text-red-500 hover:text-red-700 dark:hover:text-red-400 transition p-1 rounded-full">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Table of contents -->
            <div class="flex-1 overflow-y-auto px-4 py-5">
                <div class="flex items-center gap-2 mb-3 text-gray-500 dark:text-gray-400">
                    <i class="fa-regular fa-list-tree text-xs"></i>
                    <span class="text-[11px] font-semibold tracking-wider uppercase">Contents</span>
                </div>
                <div id="toc" class="space-y-0.5 text-sm max-h-full"></div>
                <div id="toc-placeholder" class="text-center text-gray-400 text-xs py-8 italic">
                    <i class="fa-regular fa-eye-slash block mb-2 text-lg"></i>
                    <span>No headings yet</span>
                </div>
            </div>
            
            <div class="p-4 border-t border-gray-100 dark:border-neutral-800 text-[11px] text-gray-400 text-center">
                <span>local reader · no tracking</span>
            </div>
        </div>

        <!-- Main Reading Area -->
        <div class="flex-1 flex flex-col min-w-0 w-full overflow-hidden">
            <!-- top bar -->
            <div class="h-14 border-b bg-white/80 dark:bg-neutral-900/80 backdrop-blur-sm px-5 flex items-center justify-between sticky top-0 z-20">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-neutral-800 transition">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <div id="current-file" class="text-sm font-medium text-gray-500 dark:text-gray-400 truncate max-w-[160px] sm:max-w-xs">
                        <i class="fa-regular fa-file-lines mr-1.5"></i>No document
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="toggleTheme()" class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-neutral-800 transition text-gray-600 dark:text-gray-300" aria-label="Theme">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button onclick="downloadHTML()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-xl flex items-center gap-2 shadow-sm transition-all active:scale-95">
                        <i class="fa-solid fa-download"></i>
                        <span class="hidden sm:inline-block">Export HTML</span>
                    </button>
                </div>
            </div>

            <!-- scrollable reader container -->
            <div class="flex-1 overflow-auto p-5 md:p-8 lg:p-10 bg-gray-50 dark:bg-neutral-950">
                <div id="reader" class="markdown-body prose max-w-none"></div>
                
                <!-- Empty state -->
                <div id="empty-state" class="flex flex-col items-center justify-center text-center py-16 md:py-32">
                    <div class="w-24 h-24 bg-gray-100 dark:bg-neutral-800 rounded-3xl flex items-center justify-center mb-6 shadow-inner">
                        <i class="fa-solid fa-markdown text-5xl text-gray-400 dark:text-gray-600"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-2">Drop or select a .md file</h3>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md text-sm">Markdown rendered beautifully with live TOC & dark mode</p>
                    <div class="mt-6 text-xs text-gray-400 flex gap-3">
                        <span><i class="fa-regular fa-circle-check"></i> Headings navigation</span>
                        <span><i class="fa-regular fa-save"></i> Export as HTML</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========================
        // 1. MARKED configuration (robust)
        // ========================
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,        // line breaks from markdown
                gfm: true,          // github flavored markdown
                headerIds: true,
                mangle: false,
                pedantic: false
            });
        }
        
        // state
        let currentMarkdown = '';
        let currentFileName = '';
        
        // DOM elements
        const readerDiv = document.getElementById('reader');
        const tocContainer = document.getElementById('toc');
        const tocPlaceholder = document.getElementById('toc-placeholder');
        const emptyStateDiv = document.getElementById('empty-state');
        const fileInfoDiv = document.getElementById('file-info');
        const filenameSpan = document.getElementById('filename');
        const currentFileBadge = document.getElementById('current-file');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        
        // Helper: render full markdown
        function renderMarkdown(mdContent) {
            if (!mdContent) return;
            try {
                // marked.parse returns a Promise if callback omitted, but marked.min.js legacy? use sync version
                let parsedHtml = marked.parse(mdContent);
                // in case it returns a promise (modern versions), handle both.
                if (parsedHtml && typeof parsedHtml.then === 'function') {
                    parsedHtml.then(html => {
                        readerDiv.innerHTML = html;
                        currentMarkdown = mdContent;
                        generateTOCFromDOM();
                        scrollToTopIfNeeded();
                    }).catch(e => {
                        console.warn(e);
                        readerDiv.innerHTML = `<div class="text-red-500 p-4">⚠️ Error parsing markdown</div>${marked.parse(mdContent)}`;
                        currentMarkdown = mdContent;
                        generateTOCFromDOM();
                    });
                } else {
                    readerDiv.innerHTML = parsedHtml;
                    currentMarkdown = mdContent;
                    generateTOCFromDOM();
                }
            } catch (err) {
                console.error(err);
                readerDiv.innerHTML = `<div class="text-red-500 p-4 rounded bg-red-50 dark:bg-red-950/20">⚠️ Could not render markdown: ${err.message}</div>`;
            }
        }
        
        // generate TOC from rendered headings
        function generateTOCFromDOM() {
            if (!readerDiv) return;
            const headings = readerDiv.querySelectorAll('h1, h2, h3, h4');
            tocContainer.innerHTML = '';
            
            if (!headings || headings.length === 0) {
                tocPlaceholder.classList.remove('hidden');
                return;
            }
            tocPlaceholder.classList.add('hidden');
            
            headings.forEach((heading, idx) => {
                // ensure each heading has a stable ID for linking
                let headingId = heading.id;
                if (!headingId || headingId === '') {
                    // generate slug from text or fallback
                    let rawText = heading.textContent.trim() || `heading-${idx}`;
                    headingId = rawText.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '');
                    if (!headingId) headingId = `section-${idx}`;
                    heading.id = headingId;
                }
                
                const level = heading.tagName.toLowerCase();
                let paddingClass = 'pl-3';
                if (level === 'h1') paddingClass = 'pl-2 font-semibold text-[0.85rem]';
                else if (level === 'h2') paddingClass = 'pl-5 text-[0.8rem]';
                else if (level === 'h3') paddingClass = 'pl-7 text-[0.75rem] text-gray-600 dark:text-gray-400';
                else paddingClass = 'pl-8 text-[0.7rem] text-gray-500';
                
                const link = document.createElement('a');
                link.href = `#${heading.id}`;
                link.textContent = heading.textContent.length > 60 ? heading.textContent.slice(0, 55) + '…' : heading.textContent;
                link.className = `toc-link block py-1.5 px-2 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-800/70 transition-all text-gray-700 dark:text-gray-200 ${paddingClass}`;
                link.style.cursor = 'pointer';
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.getElementById(heading.id);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        // close sidebar on mobile after click (optional)
                        if (window.innerWidth < 1024) {
                            toggleSidebar(false);
                        }
                    }
                });
                tocContainer.appendChild(link);
            });
        }
        
        // scroll to top helper after new load
        function scrollToTopIfNeeded() {
            const scrollContainer = document.querySelector('.flex-1.overflow-auto');
            if (scrollContainer) scrollContainer.scrollTop = 0;
        }
        
        // core file handler
        function handleFile(file) {
            if (!file) return;
            const validExt = /\.(md|markdown|txt)$/i;
            if (!validExt.test(file.name) && file.type !== 'text/markdown' && !file.name.endsWith('.md')) {
                alert("📄 Please select a Markdown file (.md or .markdown)");
                return;
            }
            
            currentFileName = file.name;
            filenameSpan.textContent = file.name;
            currentFileBadge.innerHTML = `<i class="fa-regular fa-file-lines mr-1.5"></i>${file.name.length > 30 ? file.name.slice(0, 27) + '…' : file.name}`;
            fileInfoDiv.classList.remove('hidden');
            emptyStateDiv.classList.add('hidden');
            
            const fileReader = new FileReader();
            fileReader.onload = (ev) => {
                const content = ev.target.result;
                renderMarkdown(content);
            };
            fileReader.onerror = () => {
                alert("Error reading file. Please try again.");
            };
            fileReader.readAsText(file, 'UTF-8');
        }
        
        // clear file
        function clearFile() {
            readerDiv.innerHTML = '';
            tocContainer.innerHTML = '';
            fileInfoDiv.classList.add('hidden');
            emptyStateDiv.classList.remove('hidden');
            currentFileBadge.innerHTML = `<i class="fa-regular fa-file-lines mr-1.5"></i>No document`;
            currentMarkdown = '';
            currentFileName = '';
            tocPlaceholder.classList.remove('hidden');
            // reset file input value to allow re-upload same file
            fileInput.value = '';
        }
        
        // export as HTML (fully standalone)
        function downloadHTML() {
            if (!currentMarkdown || currentMarkdown.trim() === '') {
                alert("No markdown loaded. Please upload a .md file first.");
                return;
            }
            
            let exportHtmlContent = '';
            try {
                const parsedForExport = marked.parse(currentMarkdown);
                const resolvePromise = (val) => {
                    exportHtmlContent = val;
                    finishDownload(exportHtmlContent);
                };
                if (parsedForExport && typeof parsedForExport.then === 'function') {
                    parsedForExport.then(resolvePromise).catch(() => {
                        exportHtmlContent = marked.parse(currentMarkdown);
                        finishDownload(exportHtmlContent);
                    });
                } else {
                    exportHtmlContent = parsedForExport;
                    finishDownload(exportHtmlContent);
                }
            } catch(e) {
                exportHtmlContent = `<p>Error rendering markdown</p><pre>${escapeHtml(currentMarkdown)}</pre>`;
                finishDownload(exportHtmlContent);
            }
            
            function finishDownload(htmlBody) {
                const titleName = (currentFileName || 'document').replace(/\.(md|markdown|txt)$/i, '');
                const finalDoc = `<!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>${escapeHtml(titleName)} · MD Reader Export</title>
                    <style>
                        body { font-family: system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif; max-width: 880px; margin: 2rem auto; padding: 2rem; line-height: 1.7; background: #fafafa; color: #1e293b; }
                        h1, h2, h3 { margin-top: 1.8rem; font-weight: 600; }
                        h1 { border-bottom: 2px solid #e2e8f0; padding-bottom: 0.3rem; }
                        pre { background: #f1f5f9; padding: 1rem; border-radius: 16px; overflow-x: auto; }
                        code { background: #eef2ff; padding: 0.2rem 0.4rem; border-radius: 8px; font-size: 0.9rem; }
                        blockquote { border-left: 4px solid #3b82f6; margin: 1rem 0; padding-left: 1rem; color: #334155; }
                        a { color: #2563eb; text-decoration: underline; }
                        img { max-width: 100%; border-radius: 12px; }
                        @media (prefers-color-scheme: dark) {
                            body { background: #0f172a; color: #e2e8f0; }
                            pre { background: #1e293b; }
                            code { background: #1e293b; color: #cbd5e1; }
                            blockquote { color: #94a3b8; }
                        }
                    </style>
                </head>
                <body>
                    <main>${htmlBody}</main>
                    <hr style="margin: 3rem 0 1rem; border-color:#e2e8f0;">
                    <footer style="font-size: 0.75rem; text-align: center; color: #64748b;">Exported from MD Reader · ${new Date().toLocaleString()}</footer>
                </body>
                </html>`;
                const blob = new Blob([finalDoc], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${titleName.replace(/[\\/:*?"<>|]/g, '_') || 'markdown_export'}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }
        
        // theme toggler (persist with localStorage)
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('mdreader_theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('mdreader_theme', 'light');
            }
        }
        
        function loadThemePreference() {
            const saved = localStorage.getItem('mdreader_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const icon = document.getElementById('theme-icon');
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }
        
        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            if (forceState === false) {
                sidebar.classList.remove('open');
            } else {
                sidebar.classList.toggle('open');
            }
        }
        
        // Event binding and initialization
        window.onload = function() {
            loadThemePreference();
            
            // Drag & Drop setup
            dropZone.addEventListener('click', (e) => {
                e.stopPropagation();
                fileInput.click();
            });
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    handleFile(files[0]);
                }
            });
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFile(e.target.files[0]);
                }
                fileInput.value = '';
            });
            
            // optional: close sidebar on resize if window becomes large (reopen if needed)
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 1024) {
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar.classList.contains('open')) sidebar.classList.remove('open');
                }
            });
        };
        
        // expose global functions
        window.clearFile = clearFile;
        window.toggleTheme = toggleTheme;
        window.downloadHTML = downloadHTML;
        window.toggleSidebar = toggleSidebar;
    </script>
</body>
</html>
